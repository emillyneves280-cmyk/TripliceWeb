<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1</title>
    <link rel="stylesheet" href="Atividade01.style.css">
</head>
<body>
<form id="formulario">
    <label for="nome">Nome Completo:</label>
    <input id="nome" type="text" name="nome"/>

    <label for="email">Email:</label>
    <input id="email" type="email" name="email"/>

    <label for="senha">Senha:</label>
    <input id="senha" type="password" name="senha"/>

    <label for="idade">Idade:</label
    ><input id="idade" type="number" name="idade"/>

    <label for="nascimento">Data de Nascimento:</label>
    <input id="nascimento" type="date" name="nascimento"/>

    <label>Gênero:</label>
    <label>Feminino<input id="mas" name="genero" type="radio"/></label>
    <label>Masculino<input id="fem" name="genero" type="radio"/></label>
    <label>Prefiro não dizer<input id="outros" name="genero" type="radio"/></label>

    <p>Turno:</p>
    <label>Matutino<input id="matutino" type="checkbox"/></label>
    <label>Vespertino<input id="vespertino" type="checkbox"/></label>
    <label>Noturno<input id="noturno" type="checkbox" /></label>


    <label for="cor">Cor Destaque</label>
    <input id="cor" type="color" name="cor"/>

    <button>Enviar</button>
    <script src="atividade01.html.js"></script>

</form>

</body>
</html>
